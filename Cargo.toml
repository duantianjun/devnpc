[package]
name = "devnpc"
version = "0.1.0"
edition = "2021"
description = "基于 GitLab 的企业级研发流程 AI 智能体"
license = "MIT"

[[bin]]
name = "devnpc"
path = "src/main.rs"

[lib]
name = "devnpc"
path = "src/lib.rs"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP / GitLab API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# LLM 抽象层 (第 1 层: agent 用 rig)
rig-core = "0.41"

# 代码感知工具 (第 2 层: tools/file_io 用 AFT)
agent-file-tools = "0.49"
tree-sitter = "0.26"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# 日志与错误
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"

# 报告 (编译期 HTML 模板)
askama = "0.12"

# 工具
url = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dotenvy = "0.15"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
tempfile = "3"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
