name: feature-team
description: 功能开发团队(PM+开发+测试)
npcs:
  - role: pm
    sop: requirement-decompose
  - role: developer
    sop: feature
  - role: tester
    sop: test-gen
handoff:
  - from: pm
    to: [developer, tester]
    trigger: pm 发出 "decomposed" 信号
  - from: developer
    to: [tester]
    trigger: developer 发出 "implemented" 信号
merge:
  strategy: single-mr